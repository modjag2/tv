<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدار البث المباشر</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #eee;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; overflow: hidden; }

  #barwrap {
    position: relative; height: 38px; background: #151515;
    border-bottom: 1px solid #2a2a2a; display: flex;
  }
  #bar {
    flex: 1; min-width: 0;
    height: 100%; display: flex; align-items: center; gap: 4px;
    padding: 0 8px; overflow-x: auto; white-space: nowrap;
    scrollbar-width: none;
  }
  #bar::-webkit-scrollbar { height: 0; display: none; }

  /* تلاشي على أطراف الشريط يدل على وجود تتمة */
  #barwrap::before, #barwrap::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 48px;
    pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 2;
  }
  /* الطرف الأيسر = نهاية الشريط في الواجهة العربية */
  #barwrap::before { left: var(--fsw, 100px);  background: linear-gradient(to right, #151515 15%, rgba(21,21,21,0)); }
  #barwrap::after  { right: 0; background: linear-gradient(to left,  #151515 15%, rgba(21,21,21,0)); }
  #barwrap.fade-end::before   { opacity: 1; }
  #barwrap.fade-start::after  { opacity: 1; }

  /* زر ملء الشاشة (أقصى اليسار) */
  #fsbtn {
    flex: none; height: 100%; display: flex; gap: 6px;
    align-items: center; justify-content: center; padding: 0 12px;
    background: #151515; color: #bbb; border: 0; font: inherit; font-size: 13px;
    border-right: 1px solid #2a2a2a; cursor: pointer; white-space: nowrap;
  }
  #fsbtn:hover { color: #fff; background: #222; }
  #fsbtn svg { width: 18px; height: 18px; }
  #fsbtn .ico-exit, #fsbtn .txt-exit { display: none; }
  body.fs #fsbtn .ico-enter, body.fs #fsbtn .txt-enter { display: none; }
  body.fs #fsbtn .ico-exit  { display: block; }
  body.fs #fsbtn .txt-exit  { display: inline; }

  /* وضع ملء الشاشة: الشريط مخفي ويظهر عند تحريك الماوس */
  body.fs #barwrap {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    transform: translateY(-100%); transition: transform .25s;
    box-shadow: 0 4px 14px rgba(0,0,0,.6);
  }
  body.fs #barwrap.show { transform: translateY(0); }
  body.fs #wall { height: 100%; }
  #hot { display: none; position: fixed; top: 0; left: 0; right: 0;
    height: 14px; z-index: 40; }
  body.fs #hot { display: block; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 14px; font-size: 13px;
    background: #232323; cursor: pointer; user-select: none;
    border: 1px solid transparent; transition: background .15s;
  }
  .chip:hover { background: #2f2f2f; }
  .chip.on { background: #1f3b5c; border-color: #3a74b5; }
  .chip input { accent-color: #3a8bff; cursor: pointer; }

  .tool { background: transparent; color: #aaa; border: 1px solid #333;
    border-radius: 14px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .tool:hover { color: #fff; border-color: #666; }
  .sep { width: 1px; height: 20px; background: #333; margin: 0 4px; flex: none; }

  #wall {
    height: calc(100% - 38px); width: 100%;
    display: flex; flex-wrap: wrap; gap: 0; background: #000;
    justify-content: center; align-content: center; overflow: hidden;
  }
  /* كل نافذة بنسبة 16:9 بالضبط، فلا تظهر أشرطة سوداء داخلها */
  .cell { position: relative; background: #0b0b0b; flex: none;
    width: 320px; height: 180px; }
  .cell iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .msg {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    color: #999; font-size: 14px; text-align: center; padding: 12px;
  }
  .msg b { color: #ddd; font-size: 15px; }
  .msg a { color: #5aa2ff; }

  #empty {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: #666; font-size: 18px; text-align: center; padding: 20px;
  }
</style>
</head>
<body>

<div id="barwrap">
  <div id="bar"></div>
  <button id="fsbtn" type="button" title="ملء الشاشة" aria-label="ملء الشاشة">
    <svg class="ico-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg class="ico-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    <span class="txt-enter">ملء الشاشة</span><span class="txt-exit">إنهاء ملء الشاشة</span>
  </button>
</div>
<div id="hot"></div>
<div id="wall"></div>

<script>
// =====================================================================
//  (1) ضع مفتاح اليوتيوب بين علامتي التنصيص هنا:
//      مثال:  const API_KEY = "AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXXX";
// =====================================================================
const API_KEY = "AIzaSyDtMD1OasbmmxFFUeZA62SQVejl3Fxp77c";

// =====================================================================
//  (2) قائمة القنوات. الحقل video اختياري: إذا عرفت رقم بث مباشر ثابت
//      (الجزء الذي بعد v= في رابط الفيديو) ضعه فيه وسيُستخدم مباشرة.
// =====================================================================
const CHANNELS = [
  { id: "alghad",       name: "الغد",               yt: "UCH4UNKBHSNwstan99YDoCVg", video: "" },
  { id: "syria_news",   name: "الإخبارية السورية",  yt: "UClm30t2F4FHzzkN9Irtr-8A", video: "" },
  { id: "al_mamlaka",   name: "المملكة",            yt: "UC0jiFAzTgl17k7awGbuoYew", video: "" },
  { id: "syria_tv",     name: "تلفزيون سوريا",      yt: "UCJsZ22yL1IW0R2u0jnnyYog", video: "" },
  { id: "aljazeera",    name: "الجزيرة",            yt: "UCfiwzLy-8yKzIbsmZTzxDgw", video: "" },
  { id: "alarabiya",    name: "العربية",            yt: "UCahpxixMCwoANAftn6IxkTg", video: "" },
  { id: "alhadath",     name: "الحدث",              yt: "UCrj5BGAhtWxDfqbza9T9hqA", video: "" },
  { id: "ekhbariya_sa", name: "الإخبارية السعودية", yt: "UCV01ajGl6nt09h40iDoHDNg", video: "" },
  { id: "shams",        name: "شمس",                yt: "UCO9kL7zKW0xINGqcX8yXOZw", video: "" },
  { id: "trt_arabi",    name: "TRT عربي",           yt: "UC5GvVahlgulCyo4cshSmbcg", video: "" }
];

const KEY = "wall_selected_v2";
const CACHE_MIN = 30; // مدة حفظ رقم البث بالدقائق (لتوفير حصة المفتاح)
const bar  = document.getElementById("bar");
const wall = document.getElementById("wall");

let selected = [];
try { selected = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
selected = selected.filter(id => CHANNELS.some(c => c.id === id));
function save() { try { localStorage.setItem(KEY, JSON.stringify(selected)); } catch (e) {} }

// ---------- البحث عن البث المباشر الحالي عبر YouTube API ----------
async function findLive(ch) {
  if (ch.video) return { vid: ch.video, embeddable: true };

  const ck = "live_" + ch.id;
  try {
    const c = JSON.parse(localStorage.getItem(ck));
    if (c && Date.now() - c.t < CACHE_MIN * 60000) return c.data;
  } catch (e) {}

  // قائمة آخر فيديوهات القناة (تكلفتها قليلة جداً من حصة المفتاح)
  const pl = "UU" + ch.yt.slice(2);
  const r1 = await fetch(
    `https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=15&playlistId=${pl}&key=${API_KEY}`);
  const j1 = await r1.json();
  if (j1.error) throw new Error(j1.error.message || "API error");
  const ids = (j1.items || []).map(i => i.contentDetails.videoId);
  if (!ids.length) return null;

  const r2 = await fetch(
    `https://www.googleapis.com/youtube/v3/videos?part=snippet,status&id=${ids.join(",")}&key=${API_KEY}`);
  const j2 = await r2.json();
  if (j2.error) throw new Error(j2.error.message || "API error");
  let live = (j2.items || []).find(v => v.snippet.liveBroadcastContent === "live");

  // احتياطي: بحث مباشر عن البث الحي للقناة (يستهلك حصة أكبر لكنه أدق)
  if (!live) {
    const r3 = await fetch(
      `https://www.googleapis.com/youtube/v3/search?part=id&channelId=${ch.yt}&eventType=live&type=video&maxResults=3&key=${API_KEY}`);
    const j3 = await r3.json();
    if (j3.error) throw new Error(j3.error.message || "API error");
    const sid = (j3.items || []).map(i => i.id.videoId).filter(Boolean);
    if (sid.length) {
      const r4 = await fetch(
        `https://www.googleapis.com/youtube/v3/videos?part=snippet,status&id=${sid.join(",")}&key=${API_KEY}`);
      const j4 = await r4.json();
      if (j4.error) throw new Error(j4.error.message || "API error");
      const all = (j4.items || []).filter(v => v.snippet.liveBroadcastContent === "live");
      live = all.find(v => v.status.embeddable !== false) || all[0];
    }
  }
  const data = live ? { vid: live.id, embeddable: live.status.embeddable !== false } : null;

  try { localStorage.setItem(ck, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
  return data;
}

function showMsg(cell, html) {
  cell.innerHTML = `<div class="msg">${html}</div>`;
}

async function loadCell(ch, cell) {
  showMsg(cell, `<b>${ch.name}</b>جاري تحميل البث...`);

  // بدون مفتاح: نحاول الرابط المباشر للقناة (قد لا يعمل مع كل القنوات)
  if (!API_KEY && !ch.video) {
    cell.innerHTML = "";
    cell.appendChild(makeFrame(ch.name,
      `https://www.youtube.com/embed/live_stream?channel=${ch.yt}&autoplay=1&mute=1&playsinline=1`));
    return;
  }

  try {
    const res = await findLive(ch);
    if (!cell.isConnected) return;
    if (!res) {
      showMsg(cell, `<b>${ch.name}</b>لا يوجد بث مباشر حالياً<a target="_blank" rel="noopener" href="https://www.youtube.com/channel/${ch.yt}/live">افتح صفحة القناة</a>`);
    } else if (!res.embeddable) {
      showMsg(cell, `<b>${ch.name}</b>هذه القناة تمنع عرض بثها داخل المواقع<a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${res.vid}">شاهد على يوتيوب</a>`);
    } else {
      cell.innerHTML = "";
      cell.appendChild(makeFrame(ch.name,
        `https://www.youtube.com/embed/${res.vid}?autoplay=1&mute=1&playsinline=1&rel=0`));
    }
  } catch (e) {
    showMsg(cell, `<b>${ch.name}</b>تعذّر التحميل<span style="direction:ltr;font-size:12px">${e.message}</span>`);
  }
}

function makeFrame(title, src) {
  const f = document.createElement("iframe");
  f.src = src; f.title = title;
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  f.referrerPolicy = "strict-origin-when-cross-origin";
  return f;
}

// ---------- الشريط العلوي ----------
function buildBar() {
  bar.innerHTML = "";
  CHANNELS.forEach(ch => {
    const label = document.createElement("label");
    label.className = "chip" + (selected.includes(ch.id) ? " on" : "");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.includes(ch.id);
    cb.addEventListener("change", () => {
      if (cb.checked) { if (!selected.includes(ch.id)) selected.push(ch.id); }
      else selected = selected.filter(x => x !== ch.id);
      label.classList.toggle("on", cb.checked);
      save(); render();
    });
    label.append(cb, document.createTextNode(ch.name));
    bar.appendChild(label);
  });

  const sep = document.createElement("span"); sep.className = "sep"; bar.appendChild(sep);

  const all = document.createElement("button");
  all.className = "tool"; all.textContent = "تحديد الكل";
  all.onclick = () => { selected = CHANNELS.map(c => c.id); save(); buildBar(); render(); };

  const none = document.createElement("button");
  none.className = "tool"; none.textContent = "إلغاء الكل";
  none.onclick = () => { selected = []; save(); buildBar(); render(); };

  const reload = document.createElement("button");
  reload.className = "tool"; reload.textContent = "تحديث البث";
  reload.onclick = () => {
    CHANNELS.forEach(c => { try { localStorage.removeItem("live_" + c.id); } catch (e) {} });
    Object.keys(cells).forEach(id => { cells[id].remove(); delete cells[id]; });
    render();
  };

  bar.append(all, none, reload);
}

// ---------- جدار الشاشات ----------
const cells = {};

function render() {
  Object.keys(cells).forEach(id => {
    if (!selected.includes(id)) { cells[id].remove(); delete cells[id]; }
  });

  const empty = document.getElementById("empty");
  if (empty) empty.remove();

  if (selected.length === 0) {
    wall.style.paddingLeft = wall.style.paddingRight = "0px";
    const d = document.createElement("div");
    d.id = "empty";
    d.textContent = "اختر قناة أو أكثر من الشريط العلوي لعرض البث المباشر";
    wall.appendChild(d);
    return;
  }

  selected.forEach(id => {
    if (cells[id]) return;
    const ch = CHANNELS.find(c => c.id === id);
    const cell = document.createElement("div");
    cell.className = "cell";
    cells[id] = cell;
    wall.appendChild(cell);
    loadCell(ch, cell);
  });

  // الترتيب عبر CSS فقط (نقل العناصر في الصفحة يعيد تحميل المشغّلات)
  CHANNELS.forEach((c, i) => { if (cells[c.id]) cells[c.id].style.order = i; });

  // أفضل توزيع: أكبر نوافذ 16:9 ممكنة، ملتصقة ببعضها وفي منتصف الشاشة
  const n = selected.length;
  const W = wall.clientWidth, H = wall.clientHeight;
  let best = { cols: 1, tw: 0 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const tw = Math.min(W / cols, (H / rows) * 16 / 9);
    if (tw > best.tw + 0.5) best = { cols, tw };
  }
  const tw = Math.max(Math.floor(best.tw), 40);
  const th = Math.floor(tw * 9 / 16);
  const pad = Math.max(Math.floor((W - best.cols * tw) / 2), 0);
  wall.style.paddingLeft = wall.style.paddingRight = pad + "px";
  selected.forEach(id => {
    cells[id].style.width = tw + "px";
    cells[id].style.height = th + "px";
  });
}

// ---------- تلاشي أطراف الشريط ----------
const barwrap = document.getElementById("barwrap");
function updateFade() {
  barwrap.style.setProperty("--fsw", (document.getElementById("fsbtn").offsetWidth || 0) + "px");
  const max = bar.scrollWidth - bar.clientWidth;
  const pos = Math.abs(bar.scrollLeft); // في RTL قيمة scrollLeft سالبة
  barwrap.classList.toggle("fade-end",   max > 2 && pos < max - 2);
  barwrap.classList.toggle("fade-start", max > 2 && pos > 2);
}
bar.addEventListener("scroll", updateFade, { passive: true });
// تمرير الشريط بعجلة الماوس على الكمبيوتر
bar.addEventListener("wheel", e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    bar.scrollLeft -= e.deltaY; // اتجاه RTL
    e.preventDefault();
  }
}, { passive: false });

// ---------- ملء الشاشة ----------
const fsbtn = document.getElementById("fsbtn");
const hot = document.getElementById("hot");
const root = document.documentElement;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;

if (!(root.requestFullscreen || root.webkitRequestFullscreen)) {
  fsbtn.style.display = "none"; // بعض المتصفحات (مثل آيفون) لا تدعمه
}

fsbtn.addEventListener("click", () => {
  if (fsEl()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  }
});

let hideTimer;
function showBar() {
  if (!document.body.classList.contains("fs")) return;
  barwrap.classList.add("show");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function tick() {
    // لا نخفيه ما دام الماوس فوقه
    if (barwrap.matches(":hover")) { hideTimer = setTimeout(tick, 1000); return; }
    barwrap.classList.remove("show");
  }, 2500);
}

function onFsChange() {
  document.body.classList.toggle("fs", !!fsEl());
  clearTimeout(hideTimer);
  barwrap.classList.remove("show");
  setTimeout(() => { render(); updateFade(); }, 150);
}
document.addEventListener("fullscreenchange", onFsChange);
document.addEventListener("webkitfullscreenchange", onFsChange);

document.addEventListener("mousemove", showBar);
document.addEventListener("keydown", showBar);
document.addEventListener("touchstart", showBar, { passive: true });
hot.addEventListener("mouseenter", showBar);

let rt;
window.addEventListener("resize", () => {
  updateFade();
  clearTimeout(rt); rt = setTimeout(render, 150);
});
buildBar();
render();
updateFade();
setTimeout(updateFade, 300);
</script>
</body>
</html>
